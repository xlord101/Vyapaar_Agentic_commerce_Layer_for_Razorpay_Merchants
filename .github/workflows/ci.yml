name: CI — build, test, verify

# Runs on every push to main and on PRs. Proves the repo is self-contained and
# push-ready from any IDE: clone, install, build, test, verify the ledger.
#
# The Razorpay test keys live in GitHub Actions secrets
# (Settings -> Secrets and variables -> Actions):
#   RAZORPAY_KEY_ID      rzp_test_...
#   RAZORPAY_KEY_SECRET  ...
# When both are present they are passed to the verify:razorpay step as env vars
# and the real adapter is exercised against Razorpay test mode. When they are
# absent the step still runs but verifyRazorpay.ts self-skips (exits 0) — running
# on the built-in simulator is a supported mode, not an error.
#
# NOTE: a step/job `if:` cannot read the `secrets` context, so we never gate on
# it. The script itself decides whether there is anything to verify.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests (hermetic — simulator + heuristic, never hits live API)
        run: npm test

      - name: Verify audit ledger chain
        run: npm run verify:ledger

      - name: Verify Razorpay adapter against live test mode (skips if no keys)
        # A step `if:` cannot read `secrets`, so we do not gate here. The keys are
        # passed as env vars (allowed) and verifyRazorpay.ts exits 0 on its own
        # when no keys are configured.
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_FORCE_SIMULATOR: "false"
        run: npm run verify:razorpay
